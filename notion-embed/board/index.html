<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>보드</title>
<style>
  :root {
    --surface-2: #ffffff;
    --surface-1: #f7f6f3;
    --surface-0: #f1efe8;
    --text-primary: #2c2c2a;
    --text-secondary: #5f5e5a;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-2: #2c2c2a;
      --surface-1: #232322;
      --surface-0: #1c1c1b;
      --text-primary: #f1efe8;
      --text-secondary: #b4b2a9;
      --border: rgba(255,255,255,0.1);
      --border-strong: rgba(255,255,255,0.18);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--surface-0);
    color: var(--text-primary);
    padding: 16px;
  }
  .board {
    display: flex;
    gap: 16px;
    overflow-x: auto;
    padding-bottom: 8px;
  }
  .column {
    flex: 0 0 240px;
    display: flex;
    flex-direction: column;
  }
  .chip {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 6px;
    margin-bottom: 10px;
    width: fit-content;
  }
  .dot-header {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .count { color: var(--text-secondary); font-weight: 400; margin-left: 2px; }
  .scroll-area {
    background: var(--surface-1);
    border-radius: 10px;
    padding: 10px;
    height: 340px;
    overflow-y: auto;
  }
  .scroll-area::-webkit-scrollbar { width: 8px; }
  .scroll-area::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border-radius: 4px;
  }
  .card {
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 13px;
    line-height: 1.4;
  }
  .card:last-child { margin-bottom: 0; }
  .card-sub {
    font-size: 12px;
    color: var(--text-secondary);
    margin: 4px 0 0;
  }
  .empty, .status {
    text-align: center;
    padding: 14px;
    font-size: 13px;
    color: var(--text-secondary);
  }
</style>
</head>
<body>
<div class="board" id="board">
  <div class="status">불러오는 중...</div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const dataFile = params.get("data") || "daily-weekly.json";

  fetch(dataFile)
    .then(res => {
      if (!res.ok) throw new Error("not found");
      return res.json();
    })
    .then(render)
    .catch(() => {
      document.getElementById("board").innerHTML =
        '<div class="status">데이터를 불러오지 못했습니다 (' + dataFile + ')</div>';
    });

  function render(config) {
    const board = document.getElementById("board");
    board.innerHTML = "";

    (config.columns || []).forEach(col => {
      const colDiv = document.createElement("div");
      colDiv.className = "column";

      if (col.badge) {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.style.background = col.badge.bg;
        chip.style.color = col.badge.text;
        chip.textContent = col.label;
        colDiv.appendChild(chip);
      } else {
        const header = document.createElement("div");
        header.className = "dot-header";
        const dotColor = col.dotColor || "#9a988f";
        header.innerHTML =
          '<span class="dot" style="background:' + dotColor + '"></span>' +
          col.label +
          '<span class="count">' + (col.items || []).length + '</span>';
        colDiv.appendChild(header);
      }

      const scroll = document.createElement("div");
      scroll.className = "scroll-area";
      const items = col.items || [];

      if (items.length === 0) {
        scroll.innerHTML = '<div class="empty">+ New page</div>';
      } else {
        items.forEach(item => {
          const card = document.createElement("div");
          card.className = "card";
          if (typeof item === "string") {
            card.textContent = item;
          } else {
            card.innerHTML =
              (item.title || "") +
              (item.sub ? '<p class="card-sub">' + item.sub + '</p>' : "");
          }
          scroll.appendChild(card);
        });
      }
      colDiv.appendChild(scroll);
      board.appendChild(colDiv);
    });
  }
</script>
</body>
</html>
