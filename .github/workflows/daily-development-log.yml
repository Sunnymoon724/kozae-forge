name: Daily development log

on:
  workflow_call:
    inputs:
      file-directory:
        required: false
        default: Documents/Blog
        type: string
      branch:
        required: false
        default: main
        type: string
      timezone:
        required: false
        default: Asia/Seoul
        type: string
      save-file:
        required: false
        default: true
        type: boolean
      publish:
        required: false
        default: false
        type: boolean
      publish-url:
        required: false
        default: ''
        type: string
      api-url:
        required: true
        type: string
      model:
        required: true
        type: string
      prompt:
        required: true
        type: string
      output-file:
        description: Output file name or path; defaults to YYYY-MM-DD-development-log.md
        required: false
        default: ''
        type: string
    secrets:
      AI_API_KEY:
        required: true

permissions:
  contents: write

jobs:
  daily-development-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - id: time-range
        shell: bash
        env:
          TIMEZONE: ${{ inputs.timezone }}
        run: |
          export TZ="$TIMEZONE"
          START_TIME="$(date -d 'yesterday 00:00' '+%F %H:%M')"
          END_TIME="$(date -d 'today 00:00' '+%F %H:%M')"
          DATE="$(date -d 'yesterday' +%F)"
          echo "start-time=$START_TIME" >> "$GITHUB_OUTPUT"
          echo "end-time=$END_TIME" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - id: collect
        uses: Sunnymoon724/kozae-forge/actions/collect-commits@main
        with:
          start-time: ${{ steps.time-range.outputs.start-time }}
          end-time: ${{ steps.time-range.outputs.end-time }}
          timezone: ${{ inputs.timezone }}

      - id: generate
        if: steps.collect.outputs.has-content == 'true'
        uses: Sunnymoon724/kozae-forge/actions/generate-content@main
        with:
          api-url: ${{ inputs.api-url }}
          model: ${{ inputs.model }}
          date: ${{ steps.time-range.outputs.date }}
          content: ${{ steps.collect.outputs.commits }}
          prompt: ${{ inputs.prompt }}
          output-file: ${{ inputs.output-file }}
          api-key: ${{ secrets.AI_API_KEY }}

      - if: inputs.save-file && steps.collect.outputs.has-content == 'true'
        uses: Sunnymoon724/kozae-forge/actions/copy-file@main
        with:
          file-path: ${{ inputs.file-directory }}/${{ steps.generate.outputs.file-name }}
          source-file: ${{ steps.generate.outputs.file-name }}

      - if: inputs.save-file && steps.collect.outputs.has-content == 'true'
        uses: Sunnymoon724/kozae-forge/actions/commit-changes@main
        with:
          destination-directory: .

      - if: inputs.save-file && steps.collect.outputs.has-content == 'true'
        uses: Sunnymoon724/kozae-forge/actions/push-changes@main
        with:
          destination-directory: .
          branch: ${{ inputs.branch }}

      - if: inputs.publish && steps.collect.outputs.has-content == 'true'
        uses: Sunnymoon724/kozae-forge/actions/publish-content@main
        with:
          file-name: ${{ steps.generate.outputs.file-name }}
          publish-url: ${{ inputs.publish-url }}
