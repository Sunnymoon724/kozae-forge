name: Generate commit log

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label used for generated jobs
        required: false
        default: ubuntu-latest
        type: string
      branch:
        required: false
        default: main
        type: string
      timezone:
        required: true
        type: string
      target-date:
        description: Date to generate the commit log for in YYYY-MM-DD format
        required: true
        type: string
      authors:
        description: Optional comma-separated commit author names or email filters
        required: false
        default: ''
        type: string
      provider:
        required: true
        type: string
      api-base:
        required: true
        type: string
      model:
        required: true
        type: string
      max-content-bytes:
        description: Maximum input content size in bytes
        required: true
        type: number
      prompt:
        required: true
        type: string
      tag:
        description: Tag included in the generated file name
        required: true
        type: string
    secrets:
      API_KEY:
        required: true
    outputs:
      has-content:
        value: ${{ jobs.generate.outputs.has-content }}
      file-name:
        value: ${{ jobs.generate.outputs.file-name }}

permissions:
  contents: read

jobs:
  generate:
    runs-on: ${{ inputs.runner }}
    outputs:
      has-content: ${{ steps.collect.outputs.has-content }}
      file-name: ./${{ steps.time-range.outputs.date }}-${{ inputs.tag }}.md
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - id: time-range
        uses: Sunnymoon724/kozae-forge/actions/calculate-date-range@main
        with:
          timezone: ${{ inputs.timezone }}
          target-date: ${{ inputs.target-date }}

      - id: collect
        uses: Sunnymoon724/kozae-forge/actions/collect-git-commits@main
        with:
          start-time: ${{ steps.time-range.outputs.start-time }}
          end-time: ${{ steps.time-range.outputs.end-time }}
          timezone: ${{ inputs.timezone }}
          authors: ${{ inputs.authors }}

      - id: request
        if: steps.collect.outputs.has-content == 'true'
        uses: Sunnymoon724/kozae-forge/actions/prepare-content@main
        with:
          content: ${{ steps.collect.outputs.commits }}

      - if: steps.collect.outputs.has-content == 'true'
        uses: Sunnymoon724/kozae-forge/actions/validate-content-size@main
        with:
          content: ${{ steps.request.outputs.content }}
          max-content-bytes: ${{ inputs.max-content-bytes }}

      - id: generated
        if: steps.collect.outputs.has-content == 'true'
        uses: Sunnymoon724/kozae-forge/actions/request-content@main
        with:
          provider: ${{ inputs.provider }}
          api-base: ${{ inputs.api-base }}
          model: ${{ inputs.model }}
          prompt: ${{ inputs.prompt }}
          content: ${{ steps.request.outputs.content }}
          api-key: ${{ secrets.API_KEY }}

      - id: generate
        if: steps.collect.outputs.has-content == 'true'
        uses: Sunnymoon724/kozae-forge/actions/save-content@main
        with:
          file-path: ./${{ steps.time-range.outputs.date }}-${{ inputs.tag }}.md
          content: ${{ steps.generated.outputs.content }}

      - name: Upload generated content
        if: steps.collect.outputs.has-content == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-content
          path: ./${{ steps.time-range.outputs.date }}-${{ inputs.tag }}.md
