name: Generate commit log

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label used for generated jobs
        required: false
        default: ubuntu-latest
        type: string
      branch:
        required: false
        default: main
        type: string
      timezone:
        required: true
        type: string
      start-date:
        description: Start date in YYYY-MM-DD format. Defaults to yesterday when empty.
        required: false
        default: ''
        type: string
      end-date:
        description: Optional end date in YYYY-MM-DD format. Empty means start-date only.
        required: false
        default: ''
        type: string
      authors:
        description: Optional comma-separated commit author names or email filters
        required: false
        default: ''
        type: string
      provider:
        required: true
        type: string
      api-base:
        required: true
        type: string
      model:
        required: true
        type: string
      max-content-bytes:
        description: Maximum input content size in bytes
        required: true
        type: number
      prompt:
        required: true
        type: string
      tag:
        description: Tag included in the generated file name
        required: true
        type: string
    secrets:
      API_KEY:
        required: true
    outputs:
      has-content:
        value: ${{ jobs.package.outputs.has-content }}
      file-names:
        value: ${{ jobs.package.outputs.file-names }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ${{ inputs.runner }}
    outputs:
      dates: ${{ steps.dates.outputs.dates }}
    steps:
      - id: dates
        name: Validate dates
        env:
          START_DATE: ${{ inputs.start-date }}
          END_DATE: ${{ inputs.end-date }}
          TIMEZONE: ${{ inputs.timezone }}
        shell: node {0}
        run: |
          const fs = require('fs');

          const startInput = process.env.START_DATE.trim();
          const endInput = process.env.END_DATE.trim();
          const timezone = process.env.TIMEZONE.trim();
          const maxDays = 31;

          function parseDate(value, name) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) {
              throw new Error(`${name} must use YYYY-MM-DD format.`);
            }

            const [year, month, day] = value.split('-').map(Number);
            const timestamp = Date.UTC(year, month - 1, day);
            const date = new Date(timestamp);
            if (
              date.getUTCFullYear() !== year ||
              date.getUTCMonth() !== month - 1 ||
              date.getUTCDate() !== day
            ) {
              throw new Error(`${name} is not a valid calendar date.`);
            }

            return timestamp;
          }

          function formatDate(timestamp) {
            return new Date(timestamp).toISOString().slice(0, 10);
          }

          function yesterdayInTimezone() {
            let parts;
            try {
              parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: timezone,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
              }).formatToParts(new Date());
            } catch {
              throw new Error(`Invalid IANA timezone: ${timezone}`);
            }

            const values = Object.fromEntries(parts.map(({ type, value }) => [type, value]));
            const today = Date.UTC(Number(values.year), Number(values.month) - 1, Number(values.day));
            return today - 24 * 60 * 60 * 1000;
          }

          try {
            let startTimestamp;
            let endTimestamp;

            if (!startInput && !endInput) {
              startTimestamp = yesterdayInTimezone();
              endTimestamp = startTimestamp;
            } else if (!startInput && endInput) {
              throw new Error('end-date cannot be used without start-date.');
            } else {
              startTimestamp = parseDate(startInput, 'start-date');
              endTimestamp = endInput ? parseDate(endInput, 'end-date') : startTimestamp;
            }

            if (startTimestamp > endTimestamp) {
              throw new Error('start-date must not be later than end-date.');
            }

            const dayCount = Math.floor((endTimestamp - startTimestamp) / (24 * 60 * 60 * 1000)) + 1;
            if (dayCount > maxDays) {
              throw new Error(`The date range cannot be longer than ${maxDays} days.`);
            }

            const dates = [];
            for (let timestamp = startTimestamp; timestamp <= endTimestamp; timestamp += 24 * 60 * 60 * 1000) {
              dates.push(formatDate(timestamp));
            }

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `dates=${JSON.stringify(dates)}\n`);
            console.log(`Processing ${dates.length} day(s): ${dates.join(', ')}`);
          } catch (error) {
            console.error(error.message);
            process.exit(1);
          }

  generate:
    needs: prepare
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        date: ${{ fromJSON(needs.prepare.outputs.dates) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - id: time-range
        uses: Sunnymoon724/kozae-forge/actions/calculate-date-range@main
        with:
          timezone: ${{ inputs.timezone }}
          target-date: ${{ matrix.date }}

      - id: collect
        uses: Sunnymoon724/kozae-forge/actions/collect-commits-by-time@main
        with:
          start-time: ${{ steps.time-range.outputs.start-time }}
          end-time: ${{ steps.time-range.outputs.end-time }}
          timezone: ${{ inputs.timezone }}
          authors: ${{ inputs.authors }}

      - id: request
        if: steps.collect.outputs.has-content == 'true'
        uses: Sunnymoon724/kozae-forge/actions/prepare-content@main
        with:
          content: ${{ steps.collect.outputs.commits }}

      - if: steps.collect.outputs.has-content == 'true'
        uses: Sunnymoon724/kozae-forge/actions/validate-content-size@main
        with:
          content: ${{ steps.request.outputs.content }}
          max-content-bytes: ${{ inputs.max-content-bytes }}

      - id: generated
        if: steps.collect.outputs.has-content == 'true'
        uses: Sunnymoon724/kozae-forge/actions/request-content@main
        with:
          provider: ${{ inputs.provider }}
          api-base: ${{ inputs.api-base }}
          model: ${{ inputs.model }}
          prompt: ${{ inputs.prompt }}
          content: ${{ steps.request.outputs.content }}
          api-key: ${{ secrets.API_KEY }}

      - if: steps.collect.outputs.has-content == 'true'
        uses: Sunnymoon724/kozae-forge/actions/save-content@main
        with:
          file-path: ./${{ matrix.date }}-${{ inputs.tag }}.md
          content: ${{ steps.generated.outputs.content }}

      - name: Upload generated content for this date
        if: steps.collect.outputs.has-content == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-content-${{ matrix.date }}
          path: ./${{ matrix.date }}-${{ inputs.tag }}.md

  package:
    needs: generate
    runs-on: ${{ inputs.runner }}
    outputs:
      has-content: ${{ steps.package.outputs.has-content }}
      file-names: ${{ steps.package.outputs.file-names }}
    steps:
      - name: Download generated content
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: generated-content-*
          merge-multiple: true

      - id: package
        name: Check generated content
        env:
          TAG: ${{ inputs.tag }}
        shell: node {0}
        run: |
          const fs = require('fs');
          const files = fs.readdirSync('.', { withFileTypes: true })
            .filter((entry) => entry.isFile() && entry.name.endsWith(`-${process.env.TAG}.md`))
            .map((entry) => entry.name)
            .sort();

          if (files.length > 0) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `has-content=true\nfile-names=${JSON.stringify(files)}\n`);
          } else {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has-content=false\nfile-names=[]\n');
          }

      - name: Upload generated content
        if: steps.package.outputs.has-content == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-content
          path: '*.md'
          if-no-files-found: error
