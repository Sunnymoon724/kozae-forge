name: Generate commit log

on:
  workflow_call:
    inputs:
      branch:
        required: false
        default: main
        type: string
      timezone:
        required: false
        default: Asia/Seoul
        type: string
      target-date:
        description: Date to generate the commit log for in YYYY-MM-DD format; defaults to yesterday
        required: false
        default: ''
        type: string
      author:
        description: Optional commit author name or email filter
        required: false
        default: ''
        type: string
      provider:
        required: true
        type: string
      api-base:
        required: true
        type: string
      model:
        required: true
        type: string
      prompt:
        required: true
        type: string
      output-file:
        description: Output file name; defaults to YYYY-MM-DD-development-log.md
        required: false
        default: ''
        type: string
    secrets:
      API_KEY:
        required: true
    outputs:
      has-content:
        value: ${{ jobs.generate.outputs.has-content }}
      file-name:
        value: ${{ jobs.generate.outputs.file-name }}

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      has-content: ${{ steps.collect.outputs.has-content }}
      file-name: ${{ steps.generate.outputs.file-name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - id: time-range
        shell: bash
        env:
          TIMEZONE: ${{ inputs.timezone }}
          TARGET_DATE: ${{ inputs.target-date }}
        run: |
          export TZ="$TIMEZONE"
          if [ -n "$TARGET_DATE" ]; then
            DATE="$(date -d "$TARGET_DATE" +%F)"
            START_TIME="$(date -d "$DATE 00:00" '+%F %H:%M')"
            END_TIME="$(date -d "$DATE + 1 day 00:00" '+%F %H:%M')"
          else
            START_TIME="$(date -d 'yesterday 00:00' '+%F %H:%M')"
            END_TIME="$(date -d 'today 00:00' '+%F %H:%M')"
            DATE="$(date -d 'yesterday' +%F)"
          fi
          echo "start-time=$START_TIME" >> "$GITHUB_OUTPUT"
          echo "end-time=$END_TIME" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - id: collect
        uses: Sunnymoon724/kozae-forge/actions/collect-commits@main
        with:
          start-time: ${{ steps.time-range.outputs.start-time }}
          end-time: ${{ steps.time-range.outputs.end-time }}
          timezone: ${{ inputs.timezone }}
          author: ${{ inputs.author }}

      - id: generate
        if: steps.collect.outputs.has-content == 'true'
        uses: Sunnymoon724/kozae-forge/actions/generate-content@main
        with:
          provider: ${{ inputs.provider }}
          api-base: ${{ inputs.api-base }}
          model: ${{ inputs.model }}
          date: ${{ steps.time-range.outputs.date }}
          content: ${{ steps.collect.outputs.commits }}
          prompt: ${{ inputs.prompt }}
          output-file: ${{ inputs.output-file }}
          api-key: ${{ secrets.API_KEY }}

      - name: Upload generated content
        if: steps.collect.outputs.has-content == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-content
          path: ${{ steps.generate.outputs.file-name }}
