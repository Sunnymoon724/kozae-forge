name: Generate commit log

on:
  workflow_call:
    inputs:
      branch:
        required: false
        default: main
        type: string
      timezone:
        required: true
        type: string
      target-date:
        description: Date to generate the commit log for in YYYY-MM-DD format
        required: true
        type: string
      author:
        description: Optional commit author name or email filter
        required: false
        default: ''
        type: string
      authors:
        description: Optional comma-separated commit author names or email filters
        required: false
        default: ''
        type: string
      provider:
        required: true
        type: string
      api-base:
        required: true
        type: string
      model:
        required: true
        type: string
      max-content-bytes:
        description: Maximum input content size in bytes
        required: true
        type: number
      prompt:
        required: true
        type: string
      output-file:
        description: Output file path; when set, save the generated file without uploading an artifact
        required: false
        default: ''
        type: string
    secrets:
      API_KEY:
        required: true
    outputs:
      has-content:
        value: ${{ jobs.generate.outputs.has-content }}
      file-name:
        value: ${{ jobs.generate.outputs.file-name }}

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      has-content: ${{ steps.collect.outputs.has-content }}
      file-name: ${{ steps.generate.outputs.file-name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - id: time-range
        uses: Sunnymoon724/kozae-forge/actions/calculate-date-range@main
        with:
          timezone: ${{ inputs.timezone }}
          target-date: ${{ inputs.target-date }}

      - id: collect
        uses: Sunnymoon724/kozae-forge/actions/collect-commits@main
        with:
          start-time: ${{ steps.time-range.outputs.start-time }}
          end-time: ${{ steps.time-range.outputs.end-time }}
          timezone: ${{ inputs.timezone }}
          author: ${{ inputs.author }}
          authors: ${{ inputs.authors }}

      - id: generate
        if: steps.collect.outputs.has-content == 'true'
        uses: Sunnymoon724/kozae-forge/actions/generate-content@main
        with:
          provider: ${{ inputs.provider }}
          api-base: ${{ inputs.api-base }}
          model: ${{ inputs.model }}
          max-content-bytes: ${{ inputs.max-content-bytes }}
          date: ${{ steps.time-range.outputs.date }}
          content: ${{ steps.collect.outputs.commits }}
          prompt: ${{ inputs.prompt }}
          output-file: ${{ inputs.output-file }}
          api-key: ${{ secrets.API_KEY }}

      - name: Upload generated content
        if: steps.collect.outputs.has-content == 'true' && inputs.output-file == ''
        uses: actions/upload-artifact@v4
        with:
          name: generated-content
          path: ${{ steps.generate.outputs.file-name }}
