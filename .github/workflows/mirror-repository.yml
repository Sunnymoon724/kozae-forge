name: Mirror repository

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label used for the mirror job
        required: false
        default: ubuntu-latest
        type: string
      destination-repository:
        description: 'Owner and name of the destination repository'
        required: true
        type: string
      exclude-file:
        description: 'Path to the rsync exclude file in the source repository'
        required: true
        type: string
    secrets:
      PUBLIC_REPO_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: Verify destination access
        uses: Sunnymoon724/kozae-forge/actions/verify-repository@main
        with:
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          repository: ${{ inputs.destination-repository }}

      - name: Clone destination repository
        uses: Sunnymoon724/kozae-forge/actions/clone-destination-repository@main
        with:
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          repository: ${{ inputs.destination-repository }}
          destination-directory: destination-repo

      - name: Configure Git LFS remote
        uses: Sunnymoon724/kozae-forge/actions/configure-lfs-remote@main
        with:
          repository-directory: .
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          repository: ${{ inputs.destination-repository }}

      - name: Upload lfs objects
        uses: Sunnymoon724/kozae-forge/actions/upload-git-lfs-objects@main
        with:
          repository-directory: .

      - name: Copy allowed files
        uses: Sunnymoon724/kozae-forge/actions/copy-folder@main
        with:
          source-folder: .
          destination-folder: destination-repo
          delete-extra: true
          exclude-file: ${{ inputs.exclude-file }}

      - name: Commit changes
        uses: Sunnymoon724/kozae-forge/actions/commit-changes@main
        with:
          destination-directory: destination-repo

      - name: Push changes
        uses: Sunnymoon724/kozae-forge/actions/push-changes@main
        with:
          destination-directory: destination-repo
          branch: main
