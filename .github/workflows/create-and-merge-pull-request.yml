name: Merge branch or create pull request on conflict

on:
  workflow_call:
    inputs:
      source-branch:
        description: Branch to merge into the target branch
        required: true
        type: string
      source-sha:
        description: Expected source commit; stale runs are skipped when the branch has advanced
        required: false
        type: string
      target-branch:
        description: Branch that receives the changes
        required: false
        default: main
        type: string
      build-result:
        description: Deprecated compatibility input; a failed build creates a PR instead of merging
        required: false
        default: success
        type: string
      pull-request-title:
        description: Pull request title used when a merge conflict occurs
        required: false
        default: Merge changes into main
        type: string
      pull-request-body:
        description: Pull request description used when a merge conflict occurs
        required: false
        default: Created automatically because the branches have merge conflicts.
        type: string
    secrets:
      token:
        description: Deprecated compatibility secret; the Workflow uses the caller's automatic GITHUB_TOKEN
        required: false
      discord_webhook_url:
        description: Optional Discord webhook for conflicts or legacy build failures
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-or-create-pull-request:
    if: inputs.source-branch != inputs.target-branch
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ inputs.build-result != 'success' && 'build-failure' || steps.merge.outputs.outcome }}
      pull-request-url: ${{ steps.pr.outputs.pull-request-url }}
    steps:
      - name: Try merging source branch
        id: merge
        if: inputs.build-result == 'success'
        uses: Sunnymoon724/kozae-forge/actions/merge-branch@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          api-url: ${{ github.api_url }}
          source-branch: ${{ inputs.source-branch }}
          source-sha: ${{ inputs.source-sha }}
          target-branch: ${{ inputs.target-branch }}

      - name: Find or create pull request
        id: pr
        if: inputs.build-result != 'success' || steps.merge.outputs.outcome == 'conflict'
        uses: Sunnymoon724/kozae-forge/actions/ensure-pull-request@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          api-url: ${{ github.api_url }}
          source-branch: ${{ inputs.source-branch }}
          target-branch: ${{ inputs.target-branch }}
          title: ${{ inputs.pull-request-title }}
          body: ${{ inputs.pull-request-body }}

  notify-conflict:
    needs: merge-or-create-pull-request
    if: needs.merge-or-create-pull-request.outputs.outcome == 'conflict' || needs.merge-or-create-pull-request.outputs.outcome == 'build-failure'
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.discord_webhook_url }}
    steps:
      - name: Notify Discord about the pull request
        if: env.DISCORD_WEBHOOK_URL != ''
        uses: Sunnymoon724/kozae-forge/actions/notify-webhook@main
        with:
          url: ${{ env.DISCORD_WEBHOOK_URL }}
          body: >-
            {"content":"확인이 필요한 PR이 있습니다. ${{ needs.merge-or-create-pull-request.outputs.pull-request-url }}","embeds":[{"title":"Pull Request 확인 요청","url":"${{ needs.merge-or-create-pull-request.outputs.pull-request-url }}","description":"${{ needs.merge-or-create-pull-request.outputs.outcome == 'build-failure' && '호출한 빌드가 실패했습니다.' || '브랜치 충돌이 있어 자동 병합하지 못했습니다.' }}","color":15158332}]}
