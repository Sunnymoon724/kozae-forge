name: Merge branch or create pull request on conflict

on:
  workflow_call:
    inputs:
      source-branch:
        description: Branch to merge into the target branch
        required: true
        type: string
      source-sha:
        description: Expected source commit; stale runs are skipped when the branch has advanced
        required: false
        type: string
      target-branch:
        description: Branch that receives the changes
        required: false
        default: main
        type: string
      build-result:
        description: Deprecated compatibility input; a failed build creates a PR instead of merging
        required: false
        default: success
        type: string
      pull-request-title:
        description: Pull request title used when a merge conflict occurs
        required: false
        default: Merge changes into main
        type: string
      pull-request-body:
        description: Pull request description used when a merge conflict occurs
        required: false
        default: Created automatically because the branches have merge conflicts.
        type: string
    secrets:
      token:
        description: Deprecated compatibility secret; the Workflow uses the caller's automatic GITHUB_TOKEN
        required: false
      discord_webhook_url:
        description: Optional Discord webhook for conflicts or legacy build failures
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-or-create-pull-request:
    if: inputs.source-branch != inputs.target-branch
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.merge.outputs.outcome }}
      pull-request-url: ${{ steps.merge.outputs.pull-request-url }}
    steps:
      - name: Merge into target or create a pull request on conflict
        id: merge
        shell: node {0}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ inputs.source-branch }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          BUILD_RESULT: ${{ inputs.build-result }}
          PR_TITLE: ${{ inputs.pull-request-title }}
          PR_BODY: ${{ inputs.pull-request-body }}
        run: |
          import fs from 'node:fs';

          async function main() {

          const [owner, repository] = process.env.GH_REPOSITORY.split('/');
          if (!owner || !repository) throw new Error(`Invalid repository: ${process.env.GH_REPOSITORY}`);

          const apiBase = `${process.env.GH_API_URL}/repos/${owner}/${repository}`;
          async function request(path, options = {}) {
            const response = await fetch(`${apiBase}${path}`, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28',
                ...(options.body ? {'Content-Type': 'application/json'} : {}),
                ...options.headers,
              },
              body: options.body ? JSON.stringify(options.body) : undefined,
            });
            const text = await response.text();
            let data;
            try { data = text ? JSON.parse(text) : null; }
            catch { data = {message: text}; }
            return {status: response.status, ok: response.ok, data};
          }

          function output(values) {
            for (const [key, value] of Object.entries(values)) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value ?? ''}\n`);
            }
          }

          async function findOrCreatePullRequest() {
            const head = `${owner}:${process.env.SOURCE_BRANCH}`;
            const query = new URLSearchParams({
              state: 'open',
              head,
              base: process.env.TARGET_BRANCH,
              per_page: '1',
            });
            const listed = await request(`/pulls?${query}`);
            if (!listed.ok) throw new Error(`Could not search pull requests (${listed.status}): ${JSON.stringify(listed.data)}`);
            if (listed.data.length > 0) return listed.data[0];

            const created = await request('/pulls', {
              method: 'POST',
              body: {
                title: process.env.PR_TITLE,
                body: process.env.PR_BODY,
                head: process.env.SOURCE_BRANCH,
                base: process.env.TARGET_BRANCH,
              },
            });
            if (!created.ok) throw new Error(`Could not create pull request (${created.status}): ${JSON.stringify(created.data)}`);
            return created.data;
          }

          if (process.env.BUILD_RESULT !== 'success') {
            const pullRequest = await findOrCreatePullRequest();
            console.log(`Build result is ${process.env.BUILD_RESULT}; leaving PR open: ${pullRequest.html_url}`);
            output({outcome: 'build-failure', 'pull-request-url': pullRequest.html_url});
            process.exit(0);
          }

          const ref = process.env.SOURCE_BRANCH.split('/').map(encodeURIComponent).join('/');
          const source = await request(`/git/ref/heads/${ref}`);
          if (!source.ok) throw new Error(`Could not read source branch (${source.status}): ${JSON.stringify(source.data)}`);
          const sourceSha = source.data.object.sha;
          if (process.env.SOURCE_SHA && sourceSha !== process.env.SOURCE_SHA) {
            console.log(`Source branch advanced to ${sourceSha}; skipping this stale run.`);
            output({outcome: 'stale', 'pull-request-url': ''});
            process.exit(0);
          }

          const merged = await request('/merges', {
            method: 'POST',
            body: {
              base: process.env.TARGET_BRANCH,
              head: sourceSha,
              commit_message: `Merge ${process.env.SOURCE_BRANCH} into ${process.env.TARGET_BRANCH}`,
            },
          });

          if (merged.status === 201 || merged.status === 204) {
            console.log(merged.status === 204
              ? `The source branch is already included in ${process.env.TARGET_BRANCH}.`
              : `Merged ${process.env.SOURCE_BRANCH} into ${process.env.TARGET_BRANCH} at ${merged.data.sha}.`);
            output({outcome: 'merged', 'pull-request-url': ''});
            process.exit(0);
          }

          if (merged.status !== 409) {
            throw new Error(`Could not merge branch (${merged.status}): ${JSON.stringify(merged.data)}. Check token permissions and target branch rules.`);
          }

          console.log('GitHub reports a merge conflict. Creating or reusing a pull request for manual resolution.');
          const pullRequest = await findOrCreatePullRequest();
          console.log(`Conflict pull request: ${pullRequest.html_url}`);
          output({outcome: 'conflict', 'pull-request-url': pullRequest.html_url});
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });

  notify-conflict:
    needs: merge-or-create-pull-request
    if: needs.merge-or-create-pull-request.outputs.outcome == 'conflict' || needs.merge-or-create-pull-request.outputs.outcome == 'build-failure'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord about the pull request
        shell: node {0}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.discord_webhook_url }}
          PR_URL: ${{ needs.merge-or-create-pull-request.outputs.pull-request-url }}
          OUTCOME: ${{ needs.merge-or-create-pull-request.outputs.outcome }}
        run: |
          async function main() {
          const webhookUrl = process.env.DISCORD_WEBHOOK_URL;
          if (!webhookUrl) {
            console.log('Discord webhook is not configured; skipping notification.');
            process.exit(0);
          }

          const reason = process.env.OUTCOME === 'build-failure'
            ? '호출한 빌드가 실패했습니다.'
            : '브랜치 충돌이 있어 자동 병합하지 못했습니다.';
          const url = process.env.PR_URL;
          const payload = {
            content: `확인이 필요한 PR이 있습니다. ${url}`,
            embeds: [{
              title: 'Pull Request 확인 요청',
              url,
              description: `${reason}\n[PR 열기](${url})`,
              color: 15158332,
            }],
          };

          const response = await fetch(webhookUrl, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload),
          });
          if (!response.ok) throw new Error(`Discord webhook failed: ${response.status} ${await response.text()}`);
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
