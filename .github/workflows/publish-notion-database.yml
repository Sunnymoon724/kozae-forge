name: Publish Notion database entry

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label used for the publish job
        required: false
        default: ubuntu-latest
        type: string
      runner-labels:
        description: 'Optional JSON array of runner labels, for example ["self-hosted", "Windows", "X64"]'
        required: false
        default: ''
        type: string
      content-file:
        description: Repository-relative content file path; use either this or content
        required: false
        default: ''
        type: string
      content:
        description: Inline content to publish; use either this or content-file
        required: false
        default: ''
        type: string
      content-format:
        description: Content format, plain or markdown
        required: false
        default: plain
        type: string
      source-url:
        description: Notion database URL
        required: true
        type: string
      title-property:
        description: Optional database title property name; inferred when omitted
        required: false
        default: ''
        type: string
      title:
        description: Entry title used to find or create the entry
        required: true
        type: string
      group-property:
        description: Optional Select property used for grouping entries
        required: false
        default: ''
        type: string
      group-value:
        description: Optional Select property value used for grouping entries
        required: false
        default: ''
        type: string
      status-property:
        description: Optional Status property name
        required: false
        default: ''
        type: string
      status-value:
        description: Optional Status property value
        required: false
        default: ''
        type: string
      date-property:
        description: Optional date property name
        required: false
        default: ''
        type: string
      date:
        description: Optional date in YYYY-MM-DD format
        required: false
        default: ''
        type: string
      image-files:
        description: Optional newline-delimited PNG or GIF paths
        required: false
        default: ''
        type: string
    secrets:
      notion-token:
        description: Notion integration token
        required: true
    outputs:
      page-id:
        description: Created or updated Notion database page ID
        value: ${{ jobs.publish.outputs.page-id }}

jobs:
  publish:
    runs-on: ${{ inputs.runner-labels != '' && fromJSON(inputs.runner-labels) || inputs.runner }}
    outputs:
      page-id: ${{ steps.find.outputs.page-id || steps.create.outputs.page-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate content inputs
        if: (inputs.content == '') == (inputs.content-file == '')
        shell: node {0}
        run: throw new Error('Provide exactly one of content or content-file.')

      - name: Save inline content
        if: inputs.content != ''
        uses: Sunnymoon724/kozae-forge/actions/save-content@main
        with:
          file-path: .generated-content/notion-entry.md
          content: ${{ inputs.content }}

      - id: data-source
        uses: Sunnymoon724/kozae-forge/actions/resolve-notion-data-source@main
        with:
          source-url: ${{ inputs.source-url }}
          notion-token: ${{ secrets.notion-token }}

      - id: upload-images
        if: inputs.image-files != ''
        uses: Sunnymoon724/kozae-forge/actions/upload-notion-file@main
        with:
          file-paths: ${{ inputs.image-files }}
          notion-token: ${{ secrets.notion-token }}

      - id: find
        uses: Sunnymoon724/kozae-forge/actions/find-notion-database-entry@main
        with:
          data-source-id: ${{ steps.data-source.outputs.data-source-id }}
          title-property: ${{ inputs.title-property }}
          title: ${{ inputs.title }}
          notion-token: ${{ secrets.notion-token }}

      - id: create
        if: steps.find.outputs.page-id == ''
        uses: Sunnymoon724/kozae-forge/actions/create-notion-database-entry@main
        with:
          data-source-id: ${{ steps.data-source.outputs.data-source-id }}
          title-property: ${{ steps.find.outputs.title-property }}
          title: ${{ inputs.title }}
          group-property: ${{ inputs.group-property }}
          group-value: ${{ inputs.group-value }}
          status-property: ${{ inputs.status-property }}
          status-value: ${{ inputs.status-value }}
          date-property: ${{ inputs.date-property }}
          date: ${{ inputs.date }}
          content-file: ${{ inputs.content != '' && '.generated-content/notion-entry.md' || inputs.content-file }}
          content-format: ${{ inputs.content-format }}
          image-file-uploads: ${{ steps.upload-images.outputs.file-upload-ids || '[]' }}
          notion-token: ${{ secrets.notion-token }}

      - if: steps.find.outputs.page-id != ''
        uses: Sunnymoon724/kozae-forge/actions/update-notion-database-entry-properties@main
        with:
          page-id: ${{ steps.find.outputs.page-id }}
          group-property: ${{ inputs.group-property }}
          group-value: ${{ inputs.group-value }}
          status-property: ${{ inputs.status-property }}
          status-value: ${{ inputs.status-value }}
          date-property: ${{ inputs.date-property }}
          date: ${{ inputs.date }}
          notion-token: ${{ secrets.notion-token }}

      - if: steps.find.outputs.page-id != ''
        uses: Sunnymoon724/kozae-forge/actions/clear-notion-page@main
        with:
          page-id: ${{ steps.find.outputs.page-id }}
          notion-token: ${{ secrets.notion-token }}

      - if: steps.find.outputs.page-id != ''
        uses: Sunnymoon724/kozae-forge/actions/append-notion-page-content@main
        with:
          content-file: ${{ inputs.content != '' && '.generated-content/notion-entry.md' || inputs.content-file }}
          content-format: ${{ inputs.content-format }}
          page-id: ${{ steps.find.outputs.page-id }}
          image-file-uploads: ${{ steps.upload-images.outputs.file-upload-ids || '[]' }}
          notion-token: ${{ secrets.notion-token }}
