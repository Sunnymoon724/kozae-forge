name: Publish Notion database entry

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label used for the publish job
        required: false
        default: ubuntu-latest
        type: string
      content-file:
        description: Repository-relative path of the content file
        required: true
        type: string
      source-url:
        description: Notion database URL
        required: true
        type: string
      title-property:
        description: Notion database title property name
        required: true
        type: string
      title:
        description: Entry title used to find or create the entry
        required: true
        type: string
      group-property:
        description: Select property used for grouping entries
        required: true
        type: string
      group-value:
        description: Select property value used for grouping entries
        required: true
        type: string
      date-property:
        description: Optional date property name
        required: false
        default: ''
        type: string
      date:
        description: Optional date in YYYY-MM-DD format
        required: false
        default: ''
        type: string
    secrets:
      notion-token:
        description: Notion integration token
        required: true
    outputs:
      page-id:
        description: Created or updated Notion database page ID
        value: ${{ jobs.publish.outputs.page-id }}

jobs:
  publish:
    runs-on: ${{ inputs.runner }}
    outputs:
      page-id: ${{ steps.find.outputs.page-id || steps.create.outputs.page-id }}
    steps:
      - uses: actions/checkout@v4

      - id: data-source
        uses: Sunnymoon724/kozae-forge/actions/resolve-notion-data-source@main
        with:
          source-url: ${{ inputs.source-url }}
          notion-token: ${{ secrets.notion-token }}

      - id: find
        uses: Sunnymoon724/kozae-forge/actions/find-notion-database-entry@main
        with:
          data-source-id: ${{ steps.data-source.outputs.data-source-id }}
          title-property: ${{ inputs.title-property }}
          title: ${{ inputs.title }}
          notion-token: ${{ secrets.notion-token }}

      - id: create
        if: steps.find.outputs.page-id == ''
        uses: Sunnymoon724/kozae-forge/actions/create-notion-database-entry@main
        with:
          data-source-id: ${{ steps.data-source.outputs.data-source-id }}
          title-property: ${{ inputs.title-property }}
          title: ${{ inputs.title }}
          group-property: ${{ inputs.group-property }}
          group-value: ${{ inputs.group-value }}
          date-property: ${{ inputs.date-property }}
          date: ${{ inputs.date }}
          content-file: ${{ inputs.content-file }}
          notion-token: ${{ secrets.notion-token }}

      - if: steps.find.outputs.page-id != ''
        uses: Sunnymoon724/kozae-forge/actions/update-notion-database-entry-properties@main
        with:
          page-id: ${{ steps.find.outputs.page-id }}
          group-property: ${{ inputs.group-property }}
          group-value: ${{ inputs.group-value }}
          date-property: ${{ inputs.date-property }}
          date: ${{ inputs.date }}
          notion-token: ${{ secrets.notion-token }}

      - if: steps.find.outputs.page-id != ''
        uses: Sunnymoon724/kozae-forge/actions/clear-notion-page@main
        with:
          page-id: ${{ steps.find.outputs.page-id }}
          notion-token: ${{ secrets.notion-token }}

      - if: steps.find.outputs.page-id != ''
        uses: Sunnymoon724/kozae-forge/actions/append-notion-page-content@main
        with:
          content-file: ${{ inputs.content-file }}
          page-id: ${{ steps.find.outputs.page-id }}
          notion-token: ${{ secrets.notion-token }}
