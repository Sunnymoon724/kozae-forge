name: Resolve Notion data source
description: Resolve a Notion database URL to its data source ID
inputs:
  source-url: {description: Notion database URL, required: true}
  notion-token: {description: Notion integration token, required: true}
outputs:
  data-source-id: {description: Resolved Notion data source ID}
runs: {using: node24, main: index.js}
