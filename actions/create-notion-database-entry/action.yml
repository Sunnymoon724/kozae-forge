name: Create Notion database entry
description: Create a Notion database entry with title, optional properties, and content
inputs:
  data-source-id: {description: Notion data source ID, required: true}
  title-property: {description: Database title property name, required: true}
  title: {description: Entry title, required: true}
  source-issue-property: {description: Optional number property containing the stable source issue number, required: false, default: ''}
  source-issue-number: {description: Optional source issue number, required: false, default: ''}
  group-property: {description: Optional Select property name, required: false, default: ''}
  group-value: {description: Optional Select property value, required: false, default: ''}
  status-property: {description: Optional Status property name, required: false, default: ''}
  status-value: {description: Optional Status property value, required: false, default: ''}
  date-property: {description: Optional date property name, required: false, default: ''}
  date: {description: Optional date in YYYY-MM-DD format, required: false, default: ''}
  content-file: {description: File containing entry content, required: true}
  content-format: {description: 'Content format: plain or markdown', required: false, default: plain}
  image-file-uploads: {description: Optional JSON array of Notion file upload IDs, required: false, default: '[]'}
  notion-token: {description: Notion integration token, required: true}
outputs:
  page-id: {description: Created database page ID}
runs: {using: node24, main: index.js}
