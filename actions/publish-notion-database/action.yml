name: Publish Notion Database
description: Create or update a Notion database entry from a content file
inputs:
  content-file:
    description: File containing the content to publish
    required: true
  data-source-id:
    description: Notion database data source ID
    required: true
  title-property:
    description: Database title property name
    required: true
  title:
    description: Entry title used to find, create, or update the entry
    required: true
  group-property:
    description: Select property used for grouping database entries
    required: true
  group-value:
    description: Select value used for grouping database entries
    required: true
  date-property:
    description: Optional date property name
    required: false
    default: ''
  date:
    description: Optional date in YYYY-MM-DD format
    required: false
    default: ''
  notion-token:
    description: Notion integration token
    required: true
runs:
  using: composite
  steps:
    - name: Publish Notion database entry
      shell: bash
      env:
        CONTENT_FILE: ${{ inputs.content-file }}
        DATA_SOURCE_ID: ${{ inputs.data-source-id }}
        TITLE_PROPERTY: ${{ inputs.title-property }}
        TITLE: ${{ inputs.title }}
        GROUP_PROPERTY: ${{ inputs.group-property }}
        GROUP_VALUE: ${{ inputs.group-value }}
        DATE_PROPERTY: ${{ inputs.date-property }}
        DATE: ${{ inputs.date }}
        NOTION_TOKEN: ${{ inputs.notion-token }}
      run: |
        set -euo pipefail
        content="$(cat "$CONTENT_FILE")"
        headers=(-H "Authorization: Bearer $NOTION_TOKEN" -H 'Content-Type: application/json' -H 'Notion-Version: 2026-03-11')
        if [ -z "$GROUP_PROPERTY" ] || [ -z "$GROUP_VALUE" ]; then
          echo "group-property and group-value are required" >&2
          exit 1
        fi
        if { [ -n "$DATE_PROPERTY" ] && [ -z "$DATE" ]; } || { [ -z "$DATE_PROPERTY" ] && [ -n "$DATE" ]; }; then
          echo "date-property and date must be provided together" >&2
          exit 1
        fi
        query_payload="$(jq -n '{page_size: 100}')"
        query_response="$(curl --silent --show-error -X POST "https://api.notion.com/v1/data_sources/$DATA_SOURCE_ID/query" "${headers[@]}" --data "$query_payload" -w $'\nHTTP_STATUS:%{http_code}')"
        query_status="${query_response##*$'\n'HTTP_STATUS:}"
        query_body="${query_response%$'\n'HTTP_STATUS:*}"
        if [ "$query_status" -lt 200 ] || [ "$query_status" -ge 300 ]; then
          echo "Notion data source query failed (HTTP $query_status):" >&2
          echo "$query_body" >&2
          exit 1
        fi
        existing_id="$(jq -r --arg property "$TITLE_PROPERTY" --arg title "$TITLE" '.results[] | select((.in_trash == false) and ((.archived == false) or (.archived == null)) and ((.properties[$property].title[0].plain_text // "") == $title)) | .id' <<< "$query_body" | head -n 1)"
        if [ -n "$existing_id" ]; then
          page_response="$(curl --silent --show-error -X GET "https://api.notion.com/v1/pages/$existing_id" "${headers[@]}" -w $'\nHTTP_STATUS:%{http_code}')"
          page_status="${page_response##*$'\n'HTTP_STATUS:}"
          page_body="${page_response%$'\n'HTTP_STATUS:*}"
          if [ "$page_status" -lt 200 ] || [ "$page_status" -ge 300 ]; then
            echo "Notion page lookup failed (HTTP $page_status):" >&2
            echo "$page_body" >&2
            exit 1
          fi
          if [ "$(jq -r '.in_trash // true' <<< "$page_body")" != "false" ]; then
            echo "Matching page is in trash; creating a new page"
            existing_id=""
          else
            echo "Existing Notion page found: $existing_id"
            echo "Notion page URL: $(jq -r '.url // empty' <<< "$page_body")"
          fi
        fi
        if [ -n "$existing_id" ]; then
          blocks_response="$(curl --silent --show-error -X GET "https://api.notion.com/v1/blocks/$existing_id/children?page_size=100" "${headers[@]}" -w $'\nHTTP_STATUS:%{http_code}')"
          blocks_status="${blocks_response##*$'\n'HTTP_STATUS:}"
          blocks_body="${blocks_response%$'\n'HTTP_STATUS:*}"
          if [ "$blocks_status" -lt 200 ] || [ "$blocks_status" -ge 300 ]; then
            echo "Notion page blocks query failed (HTTP $blocks_status):" >&2
            echo "$blocks_body" >&2
            exit 1
          fi
          blocks="$(jq -r '.results[].id' <<< "$blocks_body")"
          while IFS= read -r block_id; do
            [ -z "$block_id" ] && continue
            curl --fail-with-body --silent --show-error -X PATCH "https://api.notion.com/v1/blocks/$block_id" "${headers[@]}" --data '{"in_trash":true}' >/dev/null
          done <<< "$blocks"
          property_payload="$(jq -n --arg group_property "$GROUP_PROPERTY" --arg group_value "$GROUP_VALUE" --arg date_property "$DATE_PROPERTY" --arg date "$DATE" '{properties: ({($group_property): {select: {name: $group_value}}} + (if $date_property == "" then {} else {($date_property): {date: {start: $date}}} end))}')"
          curl --fail-with-body --silent --show-error -X PATCH "https://api.notion.com/v1/pages/$existing_id" "${headers[@]}" --data "$property_payload" >/dev/null
          content_payload="$(jq -n --arg content "$content" '{children: [{object: "block", type: "paragraph", paragraph: {rich_text: [{type: "text", text: {content: $content}}]}}]}')"
          curl --fail-with-body --silent --show-error -X PATCH "https://api.notion.com/v1/blocks/$existing_id/children" "${headers[@]}" --data "$content_payload"
        else
          payload="$(jq -n --arg source "$DATA_SOURCE_ID" --arg property "$TITLE_PROPERTY" --arg title "$TITLE" --arg group "$GROUP_PROPERTY" --arg value "$GROUP_VALUE" --arg date_property "$DATE_PROPERTY" --arg date "$DATE" --arg content "$content" \
            '{parent: {data_source_id: $source}, properties: ({($property): {title: [{type: "text", text: {content: $title}}]}, ($group): {select: {name: $value}}} + (if $date_property == "" then {} else {($date_property): {date: {start: $date}}} end)), children: [{object: "block", type: "paragraph", paragraph: {rich_text: [{type: "text", text: {content: $content}}]}}]}')"
          create_response="$(curl --silent --show-error -X POST 'https://api.notion.com/v1/pages' "${headers[@]}" --data "$payload" -w $'\nHTTP_STATUS:%{http_code}')"
          create_status="${create_response##*$'\n'HTTP_STATUS:}"
          create_body="${create_response%$'\n'HTTP_STATUS:*}"
          if [ "$create_status" -lt 200 ] || [ "$create_status" -ge 300 ]; then
            echo "Notion page creation failed (HTTP $create_status):" >&2
            echo "$create_body" >&2
            exit 1
          fi
          echo "$create_body"
        fi
