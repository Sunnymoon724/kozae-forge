name: Sync public issue to Notion
description: Find a mirrored public issue and create or update its Notion database entry
inputs:
  github-token:
    description: Token with read access to the destination repository
    required: true
  destination-repository:
    description: Destination repository in owner/name format
    required: true
  source-issue-number:
    description: Source issue number
    required: true
  issue-title:
    description: Source issue title
    required: true
  issue-body:
    description: Source issue body
    required: false
    default: ''
  issue-state:
    description: Source issue state
    required: true
  issue-labels:
    description: JSON array of source issue labels
    required: false
    default: '[]'
  data-source-url:
    description: Notion database URL
    required: true
  status-property:
    description: Notion Status property name
    required: true
  notion-token:
    description: Notion integration token
    required: true
runs:
  using: composite
  steps:
    - name: Find mirrored public issue
      id: mirrored-issue
      uses: Sunnymoon724/kozae-forge/actions/find-mirrored-issue@main
      with:
        token: ${{ inputs.github-token }}
        destination-repository: ${{ inputs.destination-repository }}
        source-issue-number: ${{ inputs.source-issue-number }}

    - name: Validate mirrored public issue
      shell: node {0}
      env:
        ISSUE_NUMBER: ${{ steps.mirrored-issue.outputs.issue-number }}
      run: |
        if (!process.env.ISSUE_NUMBER) throw new Error('Mirrored public issue was not found.');

    - name: Resolve issue status
      id: issue-status
      shell: node {0}
      env:
        ISSUE_STATE: ${{ inputs.issue-state }}
        ISSUE_BODY: ${{ inputs.issue-body }}
        ISSUE_LABELS: ${{ inputs.issue-labels }}
      run: |
        const fs = require('node:fs');
        const labels = JSON.parse(process.env.ISSUE_LABELS || '[]').map((label) => label.name);
        const body = process.env.ISSUE_BODY || '';
        let status = '일감';
        if (process.env.ISSUE_STATE === 'closed') status = '완료';
        else if (/\[[xX]\]/.test(body)) status = '진행 중';
        else if (labels.includes('blocked') || labels.includes('보류')) status = '보류';
        else if (labels.includes('in-progress') || labels.includes('진행 중')) status = '진행 중';
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `status=${status}\n`);

    - name: Save issue content
      uses: Sunnymoon724/kozae-forge/actions/save-content@main
      with:
        file-path: .generated-content/public-issue.md
        content: |
          ${{ inputs.issue-body }}

          [GitHub 이슈 보기](https://github.com/${{ inputs.destination-repository }}/issues/${{ steps.mirrored-issue.outputs.issue-number }})

    - name: Resolve Notion data source
      id: data-source
      uses: Sunnymoon724/kozae-forge/actions/resolve-notion-data-source@main
      with:
        source-url: ${{ inputs.data-source-url }}
        notion-token: ${{ inputs.notion-token }}

    - name: Find Notion entry
      id: notion-entry
      uses: Sunnymoon724/kozae-forge/actions/find-notion-database-entry@main
      with:
        data-source-id: ${{ steps.data-source.outputs.data-source-id }}
        title: ${{ inputs.issue-title }}
        notion-token: ${{ inputs.notion-token }}

    - name: Create Notion entry
      if: steps.notion-entry.outputs.page-id == ''
      uses: Sunnymoon724/kozae-forge/actions/create-notion-database-entry@main
      with:
        data-source-id: ${{ steps.data-source.outputs.data-source-id }}
        title-property: ${{ steps.notion-entry.outputs.title-property }}
        title: ${{ inputs.issue-title }}
        status-property: ${{ inputs.status-property }}
        status-value: ${{ steps.issue-status.outputs.status }}
        content-file: .generated-content/public-issue.md
        content-format: markdown
        notion-token: ${{ inputs.notion-token }}

    - name: Update Notion entry properties
      if: steps.notion-entry.outputs.page-id != ''
      uses: Sunnymoon724/kozae-forge/actions/update-notion-database-entry-properties@main
      with:
        page-id: ${{ steps.notion-entry.outputs.page-id }}
        status-property: ${{ inputs.status-property }}
        status-value: ${{ steps.issue-status.outputs.status }}
        notion-token: ${{ inputs.notion-token }}

    - name: Clear existing Notion content
      if: steps.notion-entry.outputs.page-id != ''
      uses: Sunnymoon724/kozae-forge/actions/clear-notion-page@main
      with:
        page-id: ${{ steps.notion-entry.outputs.page-id }}
        notion-token: ${{ inputs.notion-token }}

    - name: Append issue content
      if: steps.notion-entry.outputs.page-id != ''
      uses: Sunnymoon724/kozae-forge/actions/append-notion-page-content@main
      with:
        content-file: .generated-content/public-issue.md
        content-format: markdown
        page-id: ${{ steps.notion-entry.outputs.page-id }}
        notion-token: ${{ inputs.notion-token }}
