name: Calculate date range
description: Calculate a processing time range from a date and timezone
inputs:
  target-date:
    description: Date to calculate in YYYY-MM-DD format
    required: true
  timezone:
    description: IANA timezone used to calculate the time range
    required: true
outputs:
  start-time:
    description: Start time in YYYY-MM-DD HH:mm format
  end-time:
    description: End time in YYYY-MM-DD HH:mm format
  date:
    description: Date represented by the calculated range in YYYY-MM-DD format
runs:
  using: node24
  main: index.js
