name: Update Notion database entry properties
description: Update grouping and date properties of an existing Notion database entry
inputs:
  page-id: { required: true, description: Existing Notion database page ID }
  group-property: { required: true, description: Select property used for grouping database entries }
  group-value: { required: true, description: Select value used for grouping database entries }
  date-property: { required: false, default: '', description: Optional date property name }
  date: { required: false, default: '', description: Optional date in YYYY-MM-DD format }
  notion-token: { required: true, description: Notion integration token }
runs:
  using: composite
  steps:
    - name: Update Notion database entry properties
      shell: bash
      env:
        PAGE_ID: ${{ inputs.page-id }}
        GROUP_PROPERTY: ${{ inputs.group-property }}
        GROUP_VALUE: ${{ inputs.group-value }}
        DATE_PROPERTY: ${{ inputs.date-property }}
        DATE: ${{ inputs.date }}
        NOTION_TOKEN: ${{ inputs.notion-token }}
      run: |
        set -euo pipefail
        if { [ -n "$DATE_PROPERTY" ] && [ -z "$DATE" ]; } || { [ -z "$DATE_PROPERTY" ] && [ -n "$DATE" ]; }; then echo "date-property and date must be provided together" >&2; exit 1; fi
        payload="$(jq -n --arg group_property "$GROUP_PROPERTY" --arg group_value "$GROUP_VALUE" --arg date_property "$DATE_PROPERTY" --arg date "$DATE" '{properties: ({($group_property): {select: {name: $group_value}}} + (if $date_property == "" then {} else {($date_property): {date: {start: $date}}} end))}')"
        curl --fail-with-body --silent --show-error -X PATCH "https://api.notion.com/v1/pages/$PAGE_ID" -H "Authorization: Bearer $NOTION_TOKEN" -H 'Content-Type: application/json' -H 'Notion-Version: 2026-03-11' --data "$payload"
