name: Find Notion database entry
description: Find an active Notion database entry by title
inputs:
  data-source-id: { required: true, description: Notion data source ID }
  title-property: { required: true, description: Database title property name }
  title: { required: true, description: Entry title }
  notion-token: { required: true, description: Notion integration token }
outputs:
  page-id:
    description: Matching database page ID, if found
    value: ${{ steps.find.outputs.page-id }}
runs:
  using: composite
  steps:
    - id: find
      shell: bash
      env:
        DATA_SOURCE_ID: ${{ inputs.data-source-id }}
        TITLE_PROPERTY: ${{ inputs.title-property }}
        TITLE: ${{ inputs.title }}
        NOTION_TOKEN: ${{ inputs.notion-token }}
      run: |
        set -euo pipefail
        payload='{"page_size":100}'
        response="$(curl --fail-with-body --silent --show-error -X POST "https://api.notion.com/v1/data_sources/$DATA_SOURCE_ID/query" -H "Authorization: Bearer $NOTION_TOKEN" -H 'Content-Type: application/json' -H 'Notion-Version: 2026-03-11' --data "$payload")"
        page_id="$(jq -r --arg property "$TITLE_PROPERTY" --arg title "$TITLE" '.results[] | select((.in_trash == false) and ((.archived == false) or (.archived == null)) and ((.properties[$property].title[0].plain_text // "") == $title)) | .id' <<< "$response" | head -n 1)"
        echo "page-id=$page_id" >> "$GITHUB_OUTPUT"
