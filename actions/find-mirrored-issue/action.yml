name: Find mirrored issue
description: Find a destination issue by its source issue marker
inputs:
  token: {description: GitHub token with destination repository issue read access, required: true}
  destination-repository: {description: Destination repository in owner/name format, required: true}
  source-issue-number: {description: Source issue number, required: true}
outputs:
  issue-number: {description: 'Matching destination issue number, if found'}
runs: {using: node24, main: index.js}
