name: Publish to Notion
description: Create a Notion page from a content file
inputs:
  content-file:
    description: File containing the content to publish
    required: true
  parent-page-id:
    description: Notion parent page ID
    required: true
  title:
    description: Title of the new Notion page
    required: true
  notion-token:
    description: Notion integration token
    required: true
runs:
  using: composite
  steps:
    - name: Publish to Notion
      shell: bash
      env:
        CONTENT_FILE: ${{ inputs.content-file }}
        PARENT_PAGE_ID: ${{ inputs.parent-page-id }}
        TITLE: ${{ inputs.title }}
        NOTION_TOKEN: ${{ inputs.notion-token }}
      run: |
        set -euo pipefail
        CONTENT="$(cat "$CONTENT_FILE")"
        PAYLOAD="$(jq -n \
          --arg parent "$PARENT_PAGE_ID" \
          --arg title "$TITLE" \
          --arg content "$CONTENT" \
          '{parent: {page_id: $parent}, properties: {title: {title: [{text: {content: $title}}]}}, children: [{object: "block", type: "paragraph", paragraph: {rich_text: [{type: "text", text: {content: $content}}]}}]}')"
        curl --fail-with-body --silent --show-error \
          -X POST 'https://api.notion.com/v1/pages' \
          -H "Authorization: Bearer $NOTION_TOKEN" \
          -H 'Content-Type: application/json' \
          -H 'Notion-Version: 2022-06-28' \
          --data "$PAYLOAD"
