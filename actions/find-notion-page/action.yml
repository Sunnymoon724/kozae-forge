name: Find Notion page
description: Find a Notion page by title and parent page
inputs:
  title: {description: Title of the Notion page to find, required: true}
  parent-page-id: {description: Parent Notion page ID, required: true}
  notion-token: {description: Notion integration token, required: true}
outputs:
  page-id: {description: Matching Notion page ID, if found}
runs: {using: node24, main: index.js}
