name: Map document targets
description: Map selected Markdown source files to destination documents from a mapping file
inputs:
  mapping-file: {description: Path to a JSON file containing Chronicle source mappings, required: true}
  source-files: {description: Newline-delimited Markdown source files to map, required: true}
outputs:
  matrix: {description: JSON matrix with source, target, and template entries}
  has-sources: {description: Whether at least one source file was mapped}
runs: {using: node24, main: index.js}
