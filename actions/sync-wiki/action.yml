name: Synchronize GitHub Wiki
description: Synchronize one GitHub Wiki repository to another
inputs:
  token:
    description: GitHub token with read access to the source Wiki and write access to the destination Wiki
    required: true
  source-repository:
    description: Source repository in owner/name format
    required: true
  destination-repository:
    description: Destination repository in owner/name format
    required: true
runs:
  using: composite
  steps:
    - name: Clone Wiki repositories
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        SOURCE: ${{ inputs.source-repository }}
        DESTINATION: ${{ inputs.destination-repository }}
      run: |
        git clone "https://x-access-token:${TOKEN}@github.com/${SOURCE}.wiki.git" source-wiki
        git clone "https://x-access-token:${TOKEN}@github.com/${DESTINATION}.wiki.git" destination-wiki

    - name: Synchronize Wiki files
      shell: bash
      run: |
        rsync -av --delete \
          --exclude '.git' \
          source-wiki/ destination-wiki/

    - name: Commit and push Wiki
      shell: bash
      working-directory: destination-wiki
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A

        if git diff --cached --quiet; then
          echo "No Wiki changes to commit"
        else
          git commit -m "Sync Wiki from source repository"
          git push origin master
        fi
