name: Collect issues
description: Collect source repository issues selected by a label
inputs:
  token: {description: GitHub token with source repository issue read access, required: true}
  source-repository: {description: Source repository in owner/name format, required: true}
  visibility-label: {description: Label that selects issues for mirroring, required: true}
outputs:
  issues: {description: JSON array of selected issues}
runs: {using: node24, main: index.js}
