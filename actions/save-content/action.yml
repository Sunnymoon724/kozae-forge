name: Save content
description: Save a Markdown content file to a specified path.

inputs:
  source-file:
    description: Source Markdown file to save
    required: true
  output-file:
    description: Destination path for the Markdown file
    required: true

runs:
  using: composite
  steps:
    - name: Save content
      shell: bash
      env:
        SOURCE_FILE: ${{ inputs.source-file }}
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        set -euo pipefail
        test -f "$SOURCE_FILE"
        mkdir -p "$(dirname "$OUTPUT_FILE")"
        cp "$SOURCE_FILE" "$OUTPUT_FILE"
