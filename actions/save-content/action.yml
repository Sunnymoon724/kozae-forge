name: Save content
description: Save inline content or an existing file to a target path
inputs:
  file-path:
    description: Target file path relative to the workspace
    required: true
  content:
    description: Optional inline content to save
    required: false
    default: ''
  source-file:
    description: Optional existing file to copy to the target path
    required: false
    default: ''
runs:
  using: node24
  main: index.js
