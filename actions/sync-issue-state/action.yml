name: Synchronize issue state
description: Synchronize source issue state to a destination issue
inputs:
  token:
    description: GitHub token with destination repository issue write access
    required: true
  destination-repository:
    description: Destination repository in owner/name format
    required: true
  issue-number:
    description: Destination issue number
    required: true
  issue:
    description: Source issue JSON object
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        DESTINATION_REPOSITORY: ${{ inputs.destination-repository }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        ISSUE: ${{ inputs.issue }}
      run: |
        set -euo pipefail
        gh api "repos/${DESTINATION_REPOSITORY}/issues/${ISSUE_NUMBER}" --method PATCH -f "state=$(jq -r '.state' <<<"${ISSUE}")" >/dev/null
