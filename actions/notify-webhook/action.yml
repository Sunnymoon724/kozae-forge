name: Notify webhook
description: Send an HTTP request to a notification webhook
inputs:
  url:
    description: Webhook URL
    required: true
  method:
    description: HTTP method
    required: false
    default: POST
  headers:
    description: JSON object containing HTTP headers
    required: false
    default: '{"Content-Type":"application/json"}'
  body:
    description: HTTP request body
    required: true
runs:
  using: node24
  main: index.js
