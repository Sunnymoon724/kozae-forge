name: Notify webhook
description: Send an HTTP request to a notification webhook

inputs:
  url:
    description: Webhook URL
    required: true
  method:
    description: HTTP method
    required: false
    default: POST
  headers:
    description: JSON object containing HTTP headers
    required: false
    default: '{"Content-Type":"application/json"}'
  body:
    description: HTTP request body
    required: true

runs:
  using: composite
  steps:
    - name: Send webhook notification
      shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.url }}
        HTTP_METHOD: ${{ inputs.method }}
        HTTP_HEADERS: ${{ inputs.headers }}
        HTTP_BODY: ${{ inputs.body }}
      run: |
        set -euo pipefail
        curl_args=(--fail-with-body --silent --show-error --request "$HTTP_METHOD" --data "$HTTP_BODY")
        while IFS= read -r header; do
          curl_args+=(--header "$header")
        done < <(jq -r 'to_entries[] | "\(.key): \(.value)"' <<< "$HTTP_HEADERS")
        curl "${curl_args[@]}" "$WEBHOOK_URL"
