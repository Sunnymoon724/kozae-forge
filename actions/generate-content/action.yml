name: Generate content
description: Generate content with an OpenAI-compatible AI API
inputs:
  date:
    description: Date used for the default output file name
    required: true
  provider:
    description: AI provider name
    required: true
  api-base:
    description: OpenAI-compatible API base URL
    required: true
  model:
    description: AI model name
    required: true
  content:
    description: Input content to summarize or transform
    required: false
    default: ''
  source-file:
    description: File containing input content
    required: false
    default: ''
  template-file:
    description: Optional template file appended to the input content
    required: false
    default: ''
  prompt:
    description: Instructions for generating the output
    required: true
  output-file:
    description: File where the generated content will be written
    required: false
    default: ''
  max-content-bytes:
    description: Maximum input content size in bytes
    required: true
  api-key:
    description: API key for the AI provider
    required: true
outputs:
  file-name:
    description: Generated Markdown file name
    value: ${{ steps.generate.outputs.file-name }}
runs:
  using: composite
  steps:
    - id: generate
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        API_BASE: ${{ inputs.api-base }}
        DATE: ${{ inputs.date }}
        MODEL: ${{ inputs.model }}
        CONTENT: ${{ inputs.content }}
        SOURCE_FILE: ${{ inputs.source-file }}
        TEMPLATE_FILE: ${{ inputs.template-file }}
        PROMPT: ${{ inputs.prompt }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        MAX_CONTENT_BYTES: ${{ inputs.max-content-bytes }}
        API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        if [ -z "$OUTPUT_FILE" ]; then
          OUTPUT_FILE="${DATE}-development-log.md"
        fi
        INPUT_FILE="${RUNNER_TEMP}/kozae-forge-generate-content-input"
        if [ -n "$SOURCE_FILE" ]; then
          test -f "$SOURCE_FILE"
          cp "$SOURCE_FILE" "$INPUT_FILE"
        else
          printf '%s' "$CONTENT" > "$INPUT_FILE"
        fi
        if [ -n "$TEMPLATE_FILE" ]; then
          test -f "$TEMPLATE_FILE"
          {
            printf '\n\n## Template\n\n'
            cat "$TEMPLATE_FILE"
          } >> "$INPUT_FILE"
        fi
        if [ -n "$MAX_CONTENT_BYTES" ]; then
          case "$MAX_CONTENT_BYTES" in
            ''|*[!0-9]*)
              echo "::error::max-content-bytes must be a positive integer."
              exit 1
              ;;
          esac
          if [ "$MAX_CONTENT_BYTES" -le 0 ]; then
            echo "::error::max-content-bytes must be greater than zero."
            exit 1
          fi
        fi
        case "$PROVIDER" in
          openai|openai-compatible) API_URL="${API_BASE%/}/chat/completions" ;;
          *) echo "Unsupported provider: $PROVIDER"; exit 1 ;;
        esac
        CHUNK_DIR="${RUNNER_TEMP}/kozae-forge-content-chunks"
        rm -rf "$CHUNK_DIR"
        mkdir -p "$CHUNK_DIR"
        split -b "$MAX_CONTENT_BYTES" -d -a 4 "$INPUT_FILE" "$CHUNK_DIR/chunk-"
        : > "$OUTPUT_FILE"
        CHUNK_COUNT="$(find "$CHUNK_DIR" -type f -name 'chunk-*' | wc -l | tr -d '[:space:]')"
        CHUNK_NUMBER=0
        for CHUNK_FILE in "$CHUNK_DIR"/chunk-*; do
          CHUNK_NUMBER=$((CHUNK_NUMBER + 1))
          CHUNK_PROMPT="$PROMPT

This is part $CHUNK_NUMBER of $CHUNK_COUNT of a large input. Summarize only the actual changes in this part. Do not invent context or repeat a title intended for the whole document."
          REQUEST="$(jq -n \
            --arg model "$MODEL" \
            --arg system "$CHUNK_PROMPT" \
            --rawfile content "$CHUNK_FILE" \
            '{model: $model, messages: [{role: "system", content: $system}, {role: "user", content: $content}]}' \
          )"
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -X POST "$API_URL" \
            -H "Authorization: Bearer $API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$REQUEST")"
          if [ "$CHUNK_NUMBER" -gt 1 ]; then printf '\n\n' >> "$OUTPUT_FILE"; fi
          echo "$RESPONSE" | jq -e -r '.choices[0].message.content' >> "$OUTPUT_FILE"
        done
        echo "file-name=$OUTPUT_FILE" >> "$GITHUB_OUTPUT"
