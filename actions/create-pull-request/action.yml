name: Create pull request
description: Create a pull request with workspace changes
inputs:
  token: {description: GitHub token used to create the pull request, required: true}
  branch: {description: Branch used for the pull request, required: false, default: automation/update-content}
  commit-message: {description: Commit message for the changes, required: false, default: 'docs: update generated content'}
  title: {description: Pull request title, required: false, default: 'docs: update generated content'}
  body: {description: Pull request body, required: false, default: 'This pull request contains generated content. Please review the changes before merging.'}
  labels: {description: Comma-separated labels for the pull request, required: false, default: ''}
runs: {using: node24, main: index.js}
