name: Upload Git LFS objects
description: Upload Git LFS objects to a configured remote branch
inputs:
  token:
    description: GitHub token with destination repository write access
    required: true
  repository-directory: {description: Directory of the Git repository, required: true}
  remote-name: {description: Name of the configured Git remote, required: false, default: public}
  branch: {description: Branch whose LFS objects are uploaded, required: false, default: main}
runs: {using: node24, main: index.js}
