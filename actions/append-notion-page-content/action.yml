name: Append Notion page content
description: Append plain text or Markdown blocks and optional image blocks to a Notion page
inputs:
  content-file: {description: File containing the content to append, required: true}
  content-format: {description: 'Content format: plain or markdown', required: false, default: plain}
  page-id: {description: Existing Notion page ID, required: true}
  notion-token: {description: Notion integration token, required: true}
  image-file-uploads: {description: Optional JSON array of Notion file upload IDs, required: false, default: '[]'}
runs: {using: node24, main: index.js}
