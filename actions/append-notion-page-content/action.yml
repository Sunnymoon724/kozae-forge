name: Append Notion page content
description: Append content from a file to an existing Notion page
inputs:
  content-file:
    description: File containing the content to append
    required: true
  page-id:
    description: Existing Notion page ID
    required: true
  notion-token:
    description: Notion integration token
    required: true
runs:
  using: composite
  steps:
    - name: Append Notion page content
      shell: bash
      env:
        CONTENT_FILE: ${{ inputs.content-file }}
        PAGE_ID: ${{ inputs.page-id }}
        NOTION_TOKEN: ${{ inputs.notion-token }}
      run: |
        set -euo pipefail
        content="$(cat "$CONTENT_FILE")"
        payload="$(jq -n --arg content "$content" '{children: [{object: "block", type: "paragraph", paragraph: {rich_text: [{type: "text", text: {content: $content}}]}}]}')"
        curl --fail-with-body --silent --show-error -X PATCH "https://api.notion.com/v1/blocks/$PAGE_ID/children" -H "Authorization: Bearer $NOTION_TOKEN" -H 'Content-Type: application/json' -H 'Notion-Version: 2022-06-28' --data "$payload"
