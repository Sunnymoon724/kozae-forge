name: Collect commits by time
description: Collect formatted commits in a time range
inputs:
  start-time:
    description: Inclusive range start in YYYY-MM-DD HH:mm format
    required: true
  end-time:
    description: Exclusive range end in YYYY-MM-DD HH:mm format
    required: true
  timezone:
    description: IANA timezone used to interpret the time range
    required: true
  authors:
    description: Optional comma-separated Git author filters
    required: false
    default: ''
outputs:
  commits:
    description: Formatted commits
  has-content:
    description: Whether at least one commit was found
runs:
  using: node24
  main: index.js
