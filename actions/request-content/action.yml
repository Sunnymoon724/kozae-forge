name: Request content
description: Request generated content from an OpenAI-compatible API
inputs:
  provider: {description: AI provider name, required: true}
  api-base: {description: OpenAI-compatible API base URL, required: true}
  model: {description: AI model name, required: true}
  prompt: {description: Instructions for generating content, required: true}
  content: {description: Input content sent to the AI provider, required: true}
  api-key: {description: API key for the AI provider, required: true}
outputs:
  content: {description: Generated content returned by the AI provider}
runs: {using: node24, main: index.js}
