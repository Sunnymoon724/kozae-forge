name: Write content
description: 입력받은 content를 원하는 경로의 파일로 저장하는 GitHub Action입니다.
inputs:
  file-path:
    description: Target file path relative to the workspace
    required: true
  content:
    description: Text to write to the target file
    required: true
runs:
  using: composite
  steps:
    - name: Write content
      shell: bash
      env:
        FILE_PATH: ${{ inputs.file-path }}
        CONTENT: ${{ inputs.content }}
      run: |
        set -euo pipefail
        if [ -z "$CONTENT" ]; then
          echo "Content must not be empty" >&2
          exit 1
        fi
        mkdir -p "$(dirname "$FILE_PATH")"
        printf '%s\n' "$CONTENT" > "$FILE_PATH"
