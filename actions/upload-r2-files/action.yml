name: Upload files to Cloudflare R2
description: Upload files to Cloudflare R2 and return public URLs
inputs:
  file-paths: {description: Newline-delimited file paths, required: true}
  endpoint: {description: Cloudflare R2 S3 API endpoint, required: true}
  bucket: {description: R2 bucket name, required: true}
  public-base-url: {description: Public base URL for the bucket, required: true}
  access-key-id: {description: R2 access key ID, required: true}
  secret-access-key: {description: R2 secret access key, required: true}
  key-prefix: {description: Optional object key prefix, required: false, default: weekly-images}
outputs:
  file-urls: {description: JSON array of uploaded file URLs}
  markdown-links: {description: Markdown links for uploaded files}
runs: {using: node24, main: index.js}
