name: Collect document sources
description: Collect Markdown source files from mapped directories or a Git change range
inputs:
  mapping-file: {description: Path to a JSON file containing document source mappings, required: true}
  sync-mode: {description: Synchronization mode, required: true}
  changed-files: {description: Optional newline-delimited changed-file list, required: false, default: ''}
  base-ref: {description: Comparison base ref, required: false, default: ''}
  head-ref: {description: Comparison head ref, required: false, default: HEAD}
outputs:
  source-files: {description: Newline-delimited Markdown source files}
runs: {using: node24, main: index.js}
