name: Create Notion page
description: Create a Notion page with content from a file
inputs:
  content-file: { required: true, description: File containing page content }
  parent-page-id: { required: true, description: Notion parent page ID }
  title: { required: true, description: Title of the new page }
  notion-token: { required: true, description: Notion integration token }
outputs:
  page-id:
    description: Created Notion page ID
    value: ${{ steps.create.outputs.page-id }}
runs:
  using: composite
  steps:
    - id: create
      shell: bash
      env:
        CONTENT_FILE: ${{ inputs.content-file }}
        PARENT_PAGE_ID: ${{ inputs.parent-page-id }}
        TITLE: ${{ inputs.title }}
        NOTION_TOKEN: ${{ inputs.notion-token }}
      run: |
        set -euo pipefail
        content="$(cat "$CONTENT_FILE")"
        payload="$(jq -n --arg parent "$PARENT_PAGE_ID" --arg title "$TITLE" --arg content "$content" '{parent:{page_id:$parent},properties:{title:{title:[{type:"text",text:{content:$title}}]}},children:[{object:"block",type:"paragraph",paragraph:{rich_text:[{type:"text",text:{content:$content}}]}}]}')"
        response="$(curl --fail-with-body --silent --show-error -X POST https://api.notion.com/v1/pages -H "Authorization: Bearer $NOTION_TOKEN" -H 'Content-Type: application/json' -H 'Notion-Version: 2022-06-28' --data "$payload")"
        echo "page-id=$(jq -er '.id' <<< "$response")" >> "$GITHUB_OUTPUT"
