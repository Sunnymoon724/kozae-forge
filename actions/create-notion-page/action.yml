name: Create Notion page
description: Create a Notion page with content from a file
inputs:
  content-file: {description: File containing page content, required: true}
  parent-page-id: {description: Notion parent page ID, required: true}
  title: {description: Title of the new page, required: true}
  notion-token: {description: Notion integration token, required: true}
outputs:
  page-id: {description: Created Notion page ID}
runs: {using: node24, main: index.js}
