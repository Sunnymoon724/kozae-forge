name: Collect commits
description: 지정한 시간대를 기준으로 시작 시간부터 종료 시간까지의 Git 커밋을 수집하는 GitHub Action입니다.
inputs:
  author:
    description: Optional author name or email filter
    required: false
    default: ''
  authors:
    description: Optional comma-separated author names or email filters
    required: false
    default: ''
  start-time:
    description: Start time in YYYY-MM-DD HH:mm format
    required: true
  end-time:
    description: End time in YYYY-MM-DD HH:mm format
    required: true
  timezone:
    description: IANA timezone used to interpret the time range
    required: true
outputs:
  has-content:
    description: Whether commits were found
    value: ${{ steps.collect.outputs.has-content }}
  commits:
    description: Collected commit messages
    value: ${{ steps.collect.outputs.commits }}
runs:
  using: composite
  steps:
    - id: collect
      shell: bash
      env:
        START_TIME: ${{ inputs.start-time }}
        END_TIME: ${{ inputs.end-time }}
        TIMEZONE: ${{ inputs.timezone }}
        AUTHOR: ${{ inputs.author }}
        AUTHORS: ${{ inputs.authors }}
      run: |
        set -euo pipefail
        export TZ="$TIMEZONE"
        DATE="$(date -d "$START_TIME" +%F)"
        END_DATE="$(date -d "$END_TIME" +%F)"
        START_ISO="$(date -d "$START_TIME" '+%Y-%m-%dT%H:%M:%S%z')"
        END_ISO="$(date -d "$END_TIME" '+%Y-%m-%dT%H:%M:%S%z')"
        AUTHOR_FILTER="$AUTHORS"
        if [ -z "$AUTHOR_FILTER" ]; then AUTHOR_FILTER="$AUTHOR"; fi
        AUTHOR_ARGS=()
        if [ -n "$AUTHOR_FILTER" ]; then
          AUTHOR_FILTER="${AUTHOR_FILTER//,/\\|}"
          AUTHOR_ARGS+=("--author=$AUTHOR_FILTER")
        fi
        COMMITS="$(git log --since="$START_ISO" --until="$END_ISO" "${AUTHOR_ARGS[@]}" --format='- %s (%h) [author: %an]' "$GITHUB_SHA")"
        {
          echo 'commits<<COMMIT_CONTENT'
          echo "$COMMITS"
          echo 'COMMIT_CONTENT'
        } >> "$GITHUB_OUTPUT"
        if [ -z "$COMMITS" ]; then
          echo "has-content=false" >> "$GITHUB_OUTPUT"
        else
          echo "has-content=true" >> "$GITHUB_OUTPUT"
        fi
