name: Collect changes
description: 지정한 시간대의 커밋에서 실제 파일 변경 내용을 수집하는 GitHub Action입니다.
inputs:
  author:
    description: Optional author name or email filter
    required: false
    default: ''
  start-time:
    description: Start time in YYYY-MM-DD HH:mm format
    required: true
  end-time:
    description: End time in YYYY-MM-DD HH:mm format
    required: true
  timezone:
    description: IANA timezone used to interpret the time range
    required: true
outputs:
  has-content:
    description: Whether commits were found
    value: ${{ steps.collect.outputs.has-content }}
  changes-file:
    description: Path to the collected Git diff file
    value: ${{ steps.collect.outputs.changes-file }}
runs:
  using: composite
  steps:
    - id: collect
      shell: bash
      env:
        START_TIME: ${{ inputs.start-time }}
        END_TIME: ${{ inputs.end-time }}
        TIMEZONE: ${{ inputs.timezone }}
        AUTHOR: ${{ inputs.author }}
      run: |
        set -euo pipefail
        export TZ="$TIMEZONE"
        DATE="$(date -d "$START_TIME" +%F)"
        END_DATE="$(date -d "$END_TIME" +%F)"
        START_ISO="$(date -d "$START_TIME" '+%Y-%m-%dT%H:%M:%S%z')"
        END_ISO="$(date -d "$END_TIME" '+%Y-%m-%dT%H:%M:%S%z')"
        AUTHOR_ARGS=()
        if [ -n "$AUTHOR" ]; then AUTHOR_ARGS+=("--author=$AUTHOR"); fi
        COMMITS="$(git log --since="$START_ISO" --until="$END_ISO" "${AUTHOR_ARGS[@]}" --format='%H' "$GITHUB_SHA")"
        DIFF=""
        while IFS= read -r COMMIT; do
          [ -z "$COMMIT" ] && continue
          COMMIT_DIFF="$(git diff-tree --root --patch --no-commit-id --pretty=format:'' "$COMMIT")"
          if [ -n "$COMMIT_DIFF" ]; then
            if [ -n "$DIFF" ]; then DIFF+=$'\n\n'
            fi
            DIFF+="$COMMIT_DIFF"
          fi
        done <<< "$COMMITS"
        DIFF_FILE="${RUNNER_TEMP}/kozae-forge-git-diff.patch"
        printf '%s\n' "$DIFF" > "$DIFF_FILE"
        echo "changes-file=$DIFF_FILE" >> "$GITHUB_OUTPUT"
        if [ -z "$DIFF" ]; then
          echo "has-content=false" >> "$GITHUB_OUTPUT"
        else
          echo "has-content=true" >> "$GITHUB_OUTPUT"
        fi
