name: Prepare content
description: Read optional source and template files and expose the content
inputs:
  content:
    description: Inline content used when no source file is provided
    required: false
    default: ''
  source-file:
    description: Optional file whose content replaces inline content
    required: false
    default: ''
  template-file:
    description: Optional template file appended to the content
    required: false
    default: ''
outputs:
  content:
    description: Prepared content
runs:
  using: node24
  main: index.js
